# Proyecto Python único del repositorio (captura/ y analisis/).
# Gestión con uv: https://docs.astral.sh/uv/
#
#   uv sync                                  # crea .venv e instala dependencias
#   uv run python -m analisis.run_all        # regenera figuras y resultados
#
# Si el caché de uv no es escribible (por ejemplo en un entorno con el
# sistema de ficheros restringido), exportar UV_CACHE_DIR a una ruta local.

[project]
name = "vul-hw-grupal"
version = "0.1.0"
description = "Ataque CPA sobre AES-128: captura y análisis de trazas de consumo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
]

[project.scripts]
analisis = "analisis.run_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analisis"]

[tool.uv]
package = true
