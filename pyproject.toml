# Proyecto Python único del repositorio (captura/ y analisis/).
# Gestión con uv: https://docs.astral.sh/uv/
#
#   uv sync                                  # crea .venv e instala dependencias
#   uv run python -m analisis.run_all        # regenera figuras y resultados
#
# Si el caché de uv no es escribible (por ejemplo en un entorno con el
# sistema de ficheros restringido), exportar UV_CACHE_DIR a una ruta local.

[project]
name = "vul-hw-grupal"
version = "0.1.0"
description = "Ataque CPA sobre AES-128: captura y análisis de trazas de consumo"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "matplotlib>=3.9",
]

# Captura con el ChipWhisperer (solo hace falta en el portátil conectado a él):
#   uv sync --group captura
# Se usa la rama develop de NewAE fijada a un commit porque la 6.0.0 de PyPI
# exige numpy<=1.26.4, incompatible con numpy>=2.0 y con Python 3.14.
[dependency-groups]
captura = [
    "chipwhisperer @ git+https://github.com/newaetech/chipwhisperer@c5e8151e794e86cf588aeca6ed9d9c5f5f245c28",
]

[project.scripts]
analisis = "analisis.run_all:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["analisis", "captura"]

[tool.uv]
package = true
