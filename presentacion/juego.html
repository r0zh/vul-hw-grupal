<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Juego de las monedas</title>
<!-- El juego de las monedas suelto, para ensayarlo y para las pruebas, sin el deck:
       http://127.0.0.1:8000/presentacion/juego.html
     Parámetros: ?trucada=0..9&semilla=<entero> fijan la primera partida; &static=1 enseña el
     estado del PDF (1000 tiradas reveladas). La instancia queda en window.juego. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.js", "three/addons/": "./vendor/three/addons/" } }
</script>
<link rel="stylesheet" href="css/demo.css">
<style>
  :root { --c-fondo: #f5f5f7; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: var(--c-fondo); }
  /* Una diapositiva de 1920 × 1080 escalada a la ventana, como en el deck */
  .escenario { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform: translate(-50%, -50%);
    box-sizing: border-box; padding: 34px 48px 40px; color: #1d1d1f;
    font: 500 32px/1.32 Inter, system-ui, sans-serif; letter-spacing: -.012em; -webkit-font-smoothing: antialiased; }
  .escena { position: relative; height: 100%; }
</style>
</head>
<body>
<main class="escenario"><div class="escena" id="juego"></div></main>
<script type="module">
import { mount } from './js/figuras/juego-monedas.js';

const stage = document.querySelector('.escenario');
const fit = () => { stage.style.transform = `translate(-50%, -50%) scale(${Math.min(innerWidth / 1920, innerHeight / 1080)})`; };
addEventListener('resize', fit);
fit();

const q = new URLSearchParams(location.search), options = {};
for (const k of ['trucada', 'semilla']) if (q.has(k)) options[k] = Number(q.get(k));
if (q.has('static')) options.static = true;
await document.fonts.load('600 32px Inter');
window.juego = mount(document.getElementById('juego'), options);
window.juego.start();
</script>
</body>
</html>
